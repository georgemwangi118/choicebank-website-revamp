name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Project
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm run build
          # Create Phusion Passenger restart file inside the standalone folder
          mkdir -p .next/standalone/tmp
          touch .next/standalone/tmp/restart.txt

      - name: Deploy via LFTP (Forces Correct IP)
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -e " \
            set ftp:ssl-allow true; \
            set ftp:ssl-force true; \
            set ftp:ssl-protect-data true; \
            set ssl:verify-certificate no; \
            set ftp:fix-pasv-address true; \
            open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} -p 21 196.216.245.211; \
            mirror -R .next/standalone/ /choicebank/; \
            quit"
