name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Package build
        run: |
          rm -rf .next/cache
          zip -r deploy.zip .next/ public/ server.js package.json package-lock.json

      - name: Upload to cPanel via HTTPS API
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
        run: |
          curl -s -X POST \
            "https://$CPANEL_HOST:2083/execute/Fileman/upload_files" \
            -H "Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN" \
            -F "dir=/choicebank" \
            -F "file-1=@deploy.zip"

      - name: Restart app
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
        run: |
          curl -s -X POST \
            "https://$CPANEL_HOST:2083/execute/Fileman/save_file_content" \
            -H "Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN" \
            -d "dir=/choicebank/tmp&filename=restart.txt&content="
