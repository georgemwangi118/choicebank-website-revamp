name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Prepare deploy folder
        run: |
          mkdir -p /tmp/deploy
          cp -r .next /tmp/deploy/
          cp package.json package-lock.json server.js /tmp/deploy/ 2>/dev/null || true
          cp -r public /tmp/deploy/ 2>/dev/null || true

      - name: Install production dependencies
        run: |
          cd /tmp/deploy
          npm install --omit=dev

      - name: Deploy via LFTP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -e "
            set ftp:ssl-allow true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:fix-pasv-address true;
            set net:timeout 60;
            set net:max-retries 3;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' -p 21 ${{ secrets.FTP_HOST }};
            mirror --reverse --delete --verbose /tmp/deploy/ /choicebank/;
            put /dev/null -o /choicebank/tmp/restart.txt;
            quit"
